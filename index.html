<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paddock Watch</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
 html,body{height:100%;margin:0}#map{position:absolute;inset:0;background:#12181b}
 #p{position:absolute;top:12px;left:12px;z-index:1000;background:#1b2429f2;color:#eceff1;
    font:13px system-ui,-apple-system,Segoe UI,sans-serif;padding:13px 14px;border-radius:11px;width:285px;max-width:calc(100vw - 24px);box-shadow:0 6px 22px rgba(0,0,0,.5)}
 h1{font-size:15px;margin:0 0 7px}
 .grp{display:flex;gap:4px;margin:0 0 7px;flex-wrap:wrap}
 button{font:inherit;border:1px solid #2d3a42;background:#263238;color:#eceff1;border-radius:7px;padding:6px 9px;cursor:pointer}
 button.on{background:#2f7d6b;border-color:#2f7d6b}
 .wk{display:flex;align-items:center;gap:8px;margin:2px 0 4px}
 input[type=range]{flex:1}
 .wklab{font-size:12px;color:#cfd8dc;margin-bottom:8px;font-variant-numeric:tabular-nums}
 .wklab b{color:#fff}
 .ramp{height:13px;border-radius:4px;border:1px solid #2d3a42;margin-top:7px}
 .lab{display:flex;justify-content:space-between;font-size:11px;margin-top:3px}
 .muted{color:#90a4ae}
 #sel{margin-top:10px;padding:9px 10px;background:#232f35;border:1px solid #2d3a42;border-radius:8px;font-size:12px}
 #sel .big{font-size:1.3rem;font-weight:700}
 #sel .brk{margin-top:4px;font-weight:600}
 #gap{color:#ffb74d;font-size:11px;margin-top:6px;min-height:14px}
</style>
</head>
<body>
<div id="map"></div>
<div id="p">
 <h1>Paddock Watch</h1>
 <div class="grp"><button id="pp" class="on">Plevna Downs</button><button id="pt">Tilbooroo</button></div>
 <div class="grp"><button id="bc" class="on">Ground cover</button><button id="bg">Green cover</button><button id="bt">Temperature</button><button id="br">Rainfall</button></div>
 <div class="wk"><span class="muted">older</span><input type="range" id="wk" min="0" max="3" value="3"><span class="muted">newer</span></div>
 <div class="wklab" id="wklab"></div>
 <div id="leg"></div>
 <div id="gap"></div>
 <div class="muted" style="font-size:11px;margin-top:4px">Grey squares weren't imaged on that pass. Step the slider back a pass to fill them in.</div>
 <div id="sel">Loading latest satellite data&hellip;</div>
</div>
<script>
var DATA={}, prop='plevna', layer='cover', cur=null, pos=0;
var map=L.map('map').setView([-26.9,143.5],8);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery &copy; Esri'}).addTo(map);

function cover(v){if(v==null)return '#5b6b73';return v>=80?'#1a9850':v>=65?'#66bd63':v>=50?'#a6d96a':v>=35?'#fee08b':v>=20?'#fdae61':v>=10?'#f46d43':'#d73027';}
function green(v){if(v==null)return '#5b6b73';return v>=25?'#00441b':v>=15?'#238b45':v>=10?'#41ab5d':v>=6?'#74c476':v>=3?'#a1d99b':v>=1?'#d6efc7':'#f7fcf5';}
function temp(v){if(v==null)return '#5b6b73';return v>=45?'#7a0403':v>=38?'#d93806':v>=32?'#fe9b2d':v>=26?'#f3c63a':v>=20?'#a4fc3b':v>=12?'#1bcfd4':'#4675ed';}
function rain(v){if(v==null)return '#5b6b73';return v>=150?'#08306b':v>=100?'#2171b5':v>=60?'#4292c6':v>=30?'#6baed6':v>=15?'#9ecae1':v>=5?'#c6dbef':'#f7fbff';}

var LEG={
 cover:'<div class="muted">Total ground cover, % of each square</div><div class="ramp" style="background:linear-gradient(90deg,#d73027,#f46d43,#fdae61,#fee08b,#a6d96a,#66bd63,#1a9850)"></div><div class="lab"><span>0%</span><span>50%</span><span>100%</span></div><div class="muted" style="margin-top:5px">Anything covering the soil: green plants, dry grass, dead litter, trees and mulga. In this country it is mostly dry, not feed. Red = bare dirt. Click a square for the green / dry / bare split.</div>',
 green:'<div class="muted">Actively growing (green) cover, % of each square</div><div class="ramp" style="background:linear-gradient(90deg,#f7fcf5,#d6efc7,#a1d99b,#74c476,#41ab5d,#238b45,#00441b)"></div><div class="lab"><span>0%</span><span>12%</span><span>25%+</span></div><div class="muted" style="margin-top:5px">Only the part that is photosynthesising right now. Low numbers are normal out here, it lifts after rain. Includes green mulga, so it is not all feed.</div>',
 temp:'<div class="muted">Ground surface temperature at the pass (&deg;C)</div><div class="ramp" style="background:linear-gradient(90deg,#4675ed,#1bcfd4,#a4fc3b,#f3c63a,#fe9b2d,#d93806,#7a0403)"></div><div class="lab"><span>cool</span><span>hot</span></div><div class="muted" style="margin-top:5px">Skin temperature of the dirt in mid-morning, not shade air temp.</div>',
 rain:'<div class="muted">Rain that week (mm, SILO ~5km)</div><div class="ramp" style="background:linear-gradient(90deg,#f7fbff,#c6dbef,#9ecae1,#6baed6,#4292c6,#2171b5,#08306b)"></div><div class="lab"><span>0</span><span>60</span><span>150+</span></div><div class="muted" style="margin-top:5px">Coarse (~5km), so it varies gently across the property, not paddock to paddock.</div>'
};

function slots(){
 var fs=DATA[prop].features; var p=fs.length?fs[0].properties:{}; var out=[], i;
 if(layer==='rain'){for(i=0;i<4;i++) if(('rain_w'+i) in p) out.push({suf:'w'+i, lab:p['weeklabel_w'+i]});}
 else if(layer==='temp'){for(i=0;i<5;i++) if(('temp_d'+i) in p) out.push({suf:'d'+i, lab:p['tempdate_d'+i]});}
 else {for(i=0;i<5;i++) if(('cover_d'+i) in p) out.push({suf:'d'+i, lab:p['coverdate_d'+i]});}
 return out;
}
function colf(v){return layer==='temp'?temp(v):layer==='rain'?rain(v):layer==='green'?green(v):cover(v);}
function valf(p){var suf=cur[pos].suf;return p[(layer==='green'?'green_':layer==='temp'?'temp_':layer==='rain'?'rain_':'cover_')+suf];}

var gl=null;
function stylef(f){return {fillColor:colf(valf(f.properties)),color:'#101417',weight:0.5,fillOpacity:0.82};}
function fmt(lab){if(!lab)return '';var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(lab);if(!m)return lab;var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return (+m[3])+' '+M[+m[2]-1]+' '+m[1];}
function onEach(f,l){l.on('click',function(){
  var p=f.properties, suf=cur[pos].suf, s;
  if(layer==='temp'){var v=p['temp_'+suf];
    s='<div class="big">'+(v==null?'not imaged':v+' &deg;C')+'</div><div class="muted">pass '+fmt(cur[pos].lab)+'</div>';}
  else if(layer==='rain'){var v=p['rain_'+suf];
    s='<div class="big">'+(v==null?'no reading':v+' mm')+'</div><div class="muted">'+cur[pos].lab+'</div>';}
  else {var cov=p['cover_'+suf], grn=p['green_'+suf];
    if(cov==null){s='<div class="big">not imaged</div><div class="muted">this pass ('+fmt(cur[pos].lab)+') didn\'t cover this square</div>';}
    else{var dry=Math.max(0,cov-grn), bare=Math.max(0,100-cov);
      s='<div class="big">'+(layer==='green'?grn+'% green':cov+'% cover')+'</div>'
       +'<div class="brk"><span style="color:#8bc34a">green '+grn+'%</span> <span class="muted">/</span> <span style="color:#d4b24a">dry '+dry+'%</span> <span class="muted">/</span> <span style="color:#c97b52">bare '+bare+'%</span></div>'
       +'<div class="muted">pass '+fmt(cur[pos].lab)+'</div>';}}
  document.getElementById('sel').innerHTML=s;});}

function draw(){
  if(!DATA[prop]||!cur)return;
  if(gl)map.removeLayer(gl);
  gl=L.geoJSON(DATA[prop],{style:stylef,onEachFeature:onEach}).addTo(map);
  try{map.fitBounds(gl.getBounds(),{padding:[25,25]});}catch(e){}
  var any=DATA[prop].features.some(function(f){return valf(f.properties)!=null;});
  document.getElementById('gap').textContent=any?'':'No satellite pass imaged this property on this date.';
}
function refreshSlider(){cur=slots();var sl=document.getElementById('wk');sl.max=Math.max(0,cur.length-1);sl.value=sl.max;pos=0;updateLabel();}
function updateLabel(){var lab=cur&&cur[pos]?cur[pos].lab:'';if(layer==='rain'){document.getElementById('wklab').innerHTML=lab;return;}
  var n=(pos===0)?'latest':(pos+' pass'+(pos>1?'es':'')+' back');
  document.getElementById('wklab').innerHTML='Pass date: <b>'+fmt(lab)+'</b>  <span class="muted">('+n+')</span>';}
function setProp(x){prop=x;document.getElementById('pp').className=x==='plevna'?'on':'';document.getElementById('pt').className=x==='tilbooroo'?'on':'';refreshSlider();draw();}
function setLayer(x){layer=x;['bc','bg','bt','br'].forEach(function(id){document.getElementById(id).className='';});
  document.getElementById({cover:'bc',green:'bg',temp:'bt',rain:'br'}[x]).className='on';
  document.getElementById('leg').innerHTML=LEG[x];refreshSlider();draw();}
document.getElementById('pp').onclick=function(){setProp('plevna');};
document.getElementById('pt').onclick=function(){setProp('tilbooroo');};
document.getElementById('bc').onclick=function(){setLayer('cover');};
document.getElementById('bg').onclick=function(){setLayer('green');};
document.getElementById('bt').onclick=function(){setLayer('temp');};
document.getElementById('br').onclick=function(){setLayer('rain');};
document.getElementById('wk').oninput=function(){pos=cur.length-1-(+this.value);updateLabel();draw();};

async function boot(){
  try{
    var r=await Promise.all([
      fetch('app_data/plevna_grid.geojson',{cache:'no-store'}).then(function(x){return x.json();}),
      fetch('app_data/tilbooroo_grid.geojson',{cache:'no-store'}).then(function(x){return x.json();})
    ]);
    DATA.plevna=r[0]; DATA.tilbooroo=r[1];
    document.getElementById('sel').innerHTML='Click a square for its exact values.';
    setLayer('cover');
  }catch(e){
    document.getElementById('sel').innerHTML='<span style="color:#ffb74d">Could not load the data files yet. If this is the first time, the weekly build may still be running.</span>';
  }
}
boot();
</script>
</body>
</html>
